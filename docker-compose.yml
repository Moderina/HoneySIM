x-app: &app
  build: .
  image: honeysim:latest
  init: true 
  environment:
    HONEYPOT_LOG: /data/logs/honeypot.log
    ALERT_LOG: /data/logs/alerts.log
    DATABASE_URL: sqlite:////db/honeysim.db
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  honeypot:
    <<: *app
    command: python -m honeypot.main
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "${HONEYSIM_BIND:-0.0.0.0}:${HONEYSIM_SSH_PORT:-2222}:22"
      - "${HONEYSIM_BIND:-0.0.0.0}:${HONEYSIM_HTTP_PORT:-8080}:80"
    volumes:
    - ${HONEYSIM_DATA:-./data}:/data
    networks:
      default:
        ipv4_address: ${HONEYSIM_NET:-172.28.0}.10
    restart: unless-stopped

  collector:
    <<: *app
    command: python -m collector.collector
    volumes:
      - ${HONEYSIM_DATA:-./data}:/data
      - db:/db
    restart: unless-stopped

  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - db:/db
    ports:
      - "127.0.0.1:${HONEYSIM_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${HONEYSIM_DASHBOARD_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped


  simulator:
    <<: *app
    volumes: []
    networks:
      default:
        ipv4_address: ${HONEYSIM_NET:-172.28.0}.66
    profiles: ["tools"]

networks:
  default:
    ipam:
      config:
        - subnet: ${HONEYSIM_NET:-172.28.0}.0/24 

volumes:
  db:
  e2e-data:
